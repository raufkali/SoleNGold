<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <!-- Monogram Emblem Mark -->
  <g transform="translate(6, 6)">
    <!-- Hexagonal / Diamond Gold Crest Outline -->
    <polygon points="24,2 46,24 24,46 2,24" stroke="#B89550" stroke-width="1.75" fill="none" stroke-linejoin="round" />
    <polygon points="24,6 42,24 24,42 6,24" stroke="#B89550" stroke-width="0.75" stroke-dasharray="2 2" fill="none" opacity="0.6" />
    <!-- Stylized S and G monogram in center -->
    <text x="24" y="29" font-family="'Cormorant Garamond', serif" font-size="20" font-weight="700" fill="#171717" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.5">S</text>
    <circle cx="24" cy="24" r="1.5" fill="#B89550" />
  </g>

  <!-- Typography: SOLE & GOLD -->
  <text x="68" y="30" font-family="'Cormorant Garamond', 'Cinzel', serif" font-size="24" font-weight="600" letter-spacing="4.5" fill="#171717">SOLE</text>
  <text x="156" y="30" font-family="'Cormorant Garamond', serif" font-size="22" font-weight="500" fill="#B89550">&amp;</text>
  <text x="180" y="30" font-family="'Cormorant Garamond', 'Cinzel', serif" font-size="24" font-weight="600" letter-spacing="4.5" fill="#171717">GOLD</text>

  <!-- Subtitle: ATELIER · FOOTWEAR -->
  <text x="69" y="44" font-family="'DM Sans', -apple-system, sans-serif" font-size="7.5" font-weight="500" letter-spacing="4" fill="#686868">ATELIER · FOOTWEAR</text>
</svg>
